server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Uploads de foto (o padrão do nginx é só 1 MB)
    client_max_body_size 20M;

    # Faz os erros do nginx aparecerem na aba Logs do Render
    error_log /dev/stderr warn;
    access_log /dev/stdout;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include /etc/nginx/fastcgi_params;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;

        # Socket do php-fpm dessa imagem (igual ao exemplo do Render)
        fastcgi_pass unix:/var/run/php-fpm.sock;

        # Evita "too big header" (Livewire/Filament) e timeout curto
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        fastcgi_read_timeout 120s;
    }

    location ~ /\.ht {
        deny all;
    }
}